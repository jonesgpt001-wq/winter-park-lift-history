name: lift-check-dryrun
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch test (Actions runner -> official feed)
        run: |
          curl -sf --max-time 60 "https://mtnpowder.com/feed/v3.json?bearer_token=_pQB-LhuTtus8AXazk55UBp3Xb1puupqQ4p7grG96UA" -o /tmp/feed.json
          python3 -c "import json;d=json.load(open('/tmp/feed.json'));n=[r['Name'] for r in d['Resorts']];assert 'Winter Park' in n, 'resort missing';print('feed OK from runner, resorts:',len(n))"
      - name: Run update in repo mode
        run: WP_REPO_MODE=1 python3 update.py
      - name: Diff rendered page vs live site
        run: |
          curl -sf "https://jonesgpt001-wq.github.io/winter-park-lift-history/" -o /tmp/live.html || echo "live fetch failed"
          git --no-pager diff --stat
          python3 - <<'PY'
          import re
          new = open('index.html').read()
          try:
              live = open('/tmp/live.html').read()
              strip = lambda s: re.sub(r'Last check: [^&<]+', '', s)
              print('MATCH' if strip(new)==strip(live) else 'DIFFERS (expected: one newer check)')
          except FileNotFoundError:
              print('no live copy to compare')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-index
          path: index.html
