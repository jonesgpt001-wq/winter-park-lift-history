name: lift-check
on:
  schedule:
    - cron: '7 * * * *'   # hourly, offset from top-of-hour congestion
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass off-season skip (render+publish now)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: lift-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed, append history, render site
        run: WP_REPO_MODE=1 WP_FORCE=${{ github.event.inputs.force }} python3 update.py
      - name: Commit and publish if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no changes (off-season heartbeat fresh)"
          else
            git add -A && git commit -m "Lift check $(date -u +%Y-%m-%dT%H:%MZ)" && git push
          fi
